name: publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # one simulated day per run
  workflow_dispatch:
permissions:
  contents: write   # push data commits to the orphan `data` branch only
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  data:
    # Data advances only on schedule / manual runs, never on code pushes.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Attach data branch (create orphan if missing)
        run: |
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add -B data data-branch origin/data
          else
            git worktree add --orphan -b data data-branch
          fi
      - name: Run one simulated day
        env:
          PRICEWATCH_DATA_DIR: data-branch/state
        run: pricewatch run --out data-branch/public
      - name: Check every JSON file is marked simulated
        run: python tools/check_simulated.py data-branch/public
      - name: Commit to data branch
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: simulated day $(python -c "import json;print(json.load(open('state/clock.json'))['today'])")"
          git push origin HEAD:data
  deploy:
    needs: [data]
    if: ${{ !cancelled() && (needs.data.result == 'success' || needs.data.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history of every branch for the audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Add data from the data branch
        run: |
          git fetch origin data
          git worktree add data-branch origin/data
          mkdir -p site/build/site/data
          cp -R data-branch/public/. site/build/site/data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_simulated.py site/build/site/data
      - name: "Pre-publish audit (denylist step skipped, file is local-only)"
        run: python tools/audit_publish.py --skip-denylist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/site
      - id: deploy
        uses: actions/deploy-pages@v4
